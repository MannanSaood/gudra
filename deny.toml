[graph]
all-features = true

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
unmaintained = "all"
ignore = []

[licenses]
confidence-threshold = 0.95
allow = ["Apache-2.0", "MIT", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "Apache-2.0 WITH LLVM-exception"]
include-dev = true

# Gudra is unpublished and has no maintainer-selected license yet. This skips
# only unpublished workspace crates, never dependencies. Publication stays off.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
