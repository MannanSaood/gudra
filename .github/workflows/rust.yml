name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --release
      - run: python3 scripts/check-ui.py
      - run: cargo doc --locked --no-deps

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned Rust and verified audit tools
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          python3 scripts/install-security-tools.py
      - name: RustSec advisories, licenses, dependency bans and sources (including GPU)
        run: target/security-tools/cargo-deny --all-features --locked check
      - name: Current source and available history secrets (redacted)
        run: python3 scripts/check-secrets.py --gitleaks target/security-tools/gitleaks
      - run: python3 scripts/check-vendor.py
      - run: python3 scripts/test-security-tools.py
      - run: python3 scripts/test-private-launcher-linux.py

# No release credentials, self-hosted runner, executable artifact import or
# artifact upload. GPU checks require a reviewed revision on an isolated worker.
